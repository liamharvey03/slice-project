[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voyager"
version = "3.0.0"
description = "Voyager: Autonomous Investment Thesis System"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "scipy>=1.10",
    "pandas>=2.0",
    "numpy>=1.24",
    "fredapi>=0.5.0",
    "requests>=2.31.0",
    "vectorbt>=0.26.0",
    "uvicorn>=0.38.0",
    "fastapi>=0.121.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=5.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
